<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UNAMAD Design Sync</title>
  <style>
    :root {
      --bg: #0B0F17;
      --card: #121722;
      --surface: #1A2130;
      --border: #2B3346;
      --gold: #FBBF24;
      --gold-hover: #F59E0B;
      --gold-dark: #1C1917;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --dim: #64748B;
      --red: #F87171;
      --red-bg: #450A0A;
      --green: #34D399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .title-group h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .title-group p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      background: #1E293B;
      color: #38BDF8;
      border: 1px solid #334155;
    }

    .primary-btn {
      width: 100%;
      background: var(--gold);
      color: var(--gold-dark);
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
      margin-bottom: 16px;
    }

    .primary-btn:hover {
      background: var(--gold-hover);
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .secondary-btn {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      text-align: left;
    }

    .secondary-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: #1E2738;
    }

    .secondary-btn span.tag {
      font-size: 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .status-card strong {
      color: var(--green);
    }

    .footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--dim);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1>UNAMAD Sync</h1>
      <p>Precisión Quirúrgica Nivel MCP</p>
    </div>
    <span class="badge">PRO LOCAL</span>
  </div>

  <button class="primary-btn" onclick="post('transformacion-completa')">
    ⚡ Transformación Completa (10 Pantallas)
  </button>

  <div class="section-title">Actualización por Módulos</div>
  <div class="btn-grid">
    <button class="secondary-btn" onclick="post('redisenar-catalogo')">
      <span>Catálogo (Espacio Compacto & Sin Escáner)</span>
      <span class="tag">Pantalla 02</span>
    </button>
    
    <button class="secondary-btn" onclick="post('redisenar-login-perfil')">
      <span>Login & Carnet (Logout en Perfil)</span>
      <span class="tag">01 & 06</span>
    </button>
    
    <button class="secondary-btn" onclick="post('redisenar-dashboards')">
      <span>Dashboards, Solicitudes & Inventario</span>
      <span class="tag">03, 04, 07..10</span>
    </button>

    <button class="secondary-btn" onclick="post('sanear-emojis-residuales')">
      <span>Eliminar Emojis & Nodos Residuales</span>
      <span class="tag">Limpieza</span>
    </button>
  </div>

  <div class="status-card">
    <strong>Sin Límites de MCP:</strong> Aplica exactamente la paleta Obsidian (#0B0F17) y acento Amber Gold (#FBBF24) con bordes de 1px Slate (#2B3346), eliminando todo rastro de escáner y emojis.
  </div>

  <div class="footer">
    <span>Biblioteca UNAMAD • 2026</span>
    <a onclick="post('cerrar')">Cerrar Plugin</a>
  </div>

  <script>
    function post(type) {
      parent.postMessage({ pluginMessage: { type: type } }, '*');
    }
  </script>
</body>
</html>
